# GOSST CircleCI pipeline — build only, no deployment.
#
#   fmt ─┐   ┌─ test-go1.22 ─┐   ┌─ build-linux-amd64 ──┬─ smoke ─┐
#        ├───┼─ test-go1.23 ─┼───┼─ build-linux-arm64 ──┤         ├─ package
#   vet ─┘   └─ test-go1.24 ─┘   ├─ build-darwin-amd64 ─┤         │
#                                └─ build-darwin-arm64 ─┴─────────┘
#
# Artifacts: one binary per platform (gosst-<os>-<arch>, build identity
# stamped in via -ldflags) plus SHA256SUMS, under the package job's
# Artifacts tab.
version: 2.1

executors:
  go:
    docker:
      - image: cimg/go:1.23
    resource_class: medium

jobs:
  fmt:
    executor: go
    steps:
      - checkout
      - run:
          name: gofmt
          command: |
            unformatted=$(gofmt -l .)
            if [ -n "$unformatted" ]; then
              echo "Files need gofmt:"; echo "$unformatted"; exit 1
            fi

  vet:
    executor: go
    steps:
      - checkout
      - run: make vet

  test:
    parameters:
      go:
        type: string
    docker:
      - image: cimg/go:<< parameters.go >>
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Unit tests on Go << parameters.go >> (race + coverage + JUnit)
          command: |
            go version
            mkdir -p test-results
            make test JUNIT=test-results/junit.xml
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: coverage.out
          destination: coverage-go<< parameters.go >>.out

  build:
    parameters:
      os:
        type: string
      arch:
        type: string
    executor: go
    steps:
      - checkout
      - run:
          name: Build << parameters.os >>/<< parameters.arch >>
          command: |
            mkdir -p dist
            make build \
              GOOS=<< parameters.os >> \
              GOARCH=<< parameters.arch >> \
              BINARY=dist/gosst-<< parameters.os >>-<< parameters.arch >> \
              BUILD_ID="circle-${CIRCLE_BUILD_NUM}" \
              GIT_BRANCH="${CIRCLE_BRANCH:-detached}" \
              DEPLOYED_BY=circleci
            file dist/gosst-<< parameters.os >>-<< parameters.arch >> || true
      - persist_to_workspace:
          root: .
          paths:
            - dist/gosst-<< parameters.os >>-<< parameters.arch >>

  smoke:
    executor: go
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Boot the linux/amd64 binary and hit key routes
          command: |
            chmod +x dist/gosst-linux-amd64
            PORT=8000 ./dist/gosst-linux-amd64 > server.log 2>&1 &
            for i in $(seq 1 20); do
              curl -fsS localhost:8000/health >/dev/null 2>&1 && break
              sleep 0.5
            done
            set -x
            test -n "$(curl -fsS localhost:8000/health)"
            test "$(curl -fsS localhost:8000/faux)" = "CI Demo!"
            curl -fsS localhost:8000/version
            curl -fsS localhost:8000/hostz
      - store_artifacts:
          path: server.log

  package:
    executor: go
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Checksum + stage artifacts
          command: |
            cd dist
            sha256sum gosst-* > SHA256SUMS
            ls -l
            cat SHA256SUMS
      - store_artifacts:
          path: dist
          destination: gosst

workflows:
  build:
    jobs:
      - fmt
      - vet
      - test:
          name: test-go<< matrix.go >>
          matrix:
            alias: test-all
            parameters:
              go: ["1.22", "1.23", "1.24"]
          requires: [fmt, vet]
      - build:
          name: build-<< matrix.os >>-<< matrix.arch >>
          matrix:
            alias: build-all
            parameters:
              os: [linux, darwin]
              arch: [amd64, arm64]
          requires: [test-all]
      - smoke:
          requires: [build-linux-amd64]
      - package:
          requires: [build-all, smoke]
